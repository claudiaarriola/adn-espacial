<style>
:root{
  color-scheme: dark only;
  --ink:#0F0E0B; --panel:#17150F; --panel-2:#1E1B14; --line:#2F2A20;
  --cream:#EEE6D5; --muted:#A69C88; --dim:#8C8372;
  --gold:#C8A45E; --gold-2:#E2C58A; --gold-ink:#1A150B;
  --display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --body:"Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);margin:0}
img{max-width:100%}
body{color:var(--cream);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:22px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--cream);font-weight:400}
.proto{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:4px 8px;border-radius:2px;white-space:nowrap}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;font-optical-sizing:none;font-variation-settings:"opsz" 16}
/* Óptica de texto: trazos finos más gruesos, se ven nítidos en cualquier pantalla */
h1{font-size:clamp(40px,7vw,72px);line-height:1.02;letter-spacing:-.01em;font-weight:500;font-variation-settings:"opsz" 18}
h1 em{font-style:italic;font-weight:600;font-variation-settings:"opsz" 14;color:#ECCB86}
h2{font-size:clamp(28px,4.4vw,40px);line-height:1.1}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:52ch}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start;padding-block:56px 24px}
.intro-copy{display:flex;flex-direction:column;gap:22px;padding-top:48px;position:sticky;top:24px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.btn{appearance:none;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);padding:14px 26px;font-size:15px;font-weight:500;letter-spacing:.04em;cursor:pointer;border-radius:1px;transition:background .2s,color .2s}
.btn:hover{background:var(--gold-2)}
.start-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.btn-start{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:17px 30px;font-size:16.5px;font-weight:500;letter-spacing:.05em;border-radius:999px;box-shadow:0 10px 28px -10px rgba(200,164,94,.65),inset 0 1px 0 rgba(255,255,255,.35);animation:nudge 2.6s ease-in-out 1.2s 3}
.btn-start .arr{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold-ink);color:var(--gold-2);font-size:16px;transition:transform .2s}
.btn-start:hover .arr{transform:translateX(4px)}
.btn-start:active{transform:translateY(1px);box-shadow:0 4px 12px -6px rgba(200,164,94,.6)}
.sample-col{display:flex;flex-direction:column;gap:28px;min-width:0}
.start-end{align-items:center;text-align:center}
.start-end .btn-start{animation:none}
.start-note{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
@keyframes nudge{0%,100%{box-shadow:0 10px 28px -10px rgba(200,164,94,.65),0 0 0 0 rgba(200,164,94,.45)}50%{box-shadow:0 10px 28px -10px rgba(200,164,94,.65),0 0 0 9px rgba(200,164,94,0)}}
@media (prefers-reduced-motion:reduce){.btn-start{animation:none}}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ficha (result sheet) */
.ficha{background:var(--panel);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:20px;position:relative}
.ficha.sample{transform:rotate(-1.2deg);box-shadow:0 30px 60px -30px #000}
.ficha .tag{position:absolute;top:-11px;left:24px;background:var(--ink);padding:0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.ficha-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.code{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
.row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline}
.row .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:15.5px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mosaic{display:grid;grid-template-columns:6fr 3fr 1fr;grid-template-rows:2fr 1fr;gap:3px;height:170px;border:1px solid rgba(255,255,255,.06)}
.mosaic div{position:relative;min-width:0}
.mosaic span{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.m60{grid-row:1/3}.m20{grid-column:2;grid-row:1}.m10{grid-column:2;grid-row:2}.mA{grid-column:3;grid-row:1/3}
.mA span{left:auto;right:0;left:0;text-align:center}
.legend{display:flex;flex-direction:column;gap:10px}
.lg{display:grid;grid-template-columns:44px 56px 1fr;gap:12px;align-items:start}
.lg i{display:block;height:26px;border:1px solid rgba(255,255,255,.08)}
.lg .pct{font-family:var(--mono);font-size:14px;color:var(--gold-2);line-height:26px}
.lg .nm{font-size:14.5px;line-height:1.35}
.lg .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.harm{font-size:14px;color:var(--muted);border-left:1px solid var(--gold);padding-left:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw i{display:block;aspect-ratio:1/1.15;border:1px solid rgba(255,255,255,.06)}
.sw span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.3}
.quote{font-optical-sizing:none;font-variation-settings:"opsz" 14;font-family:var(--display);font-style:italic;font-size:22px;line-height:1.25;color:var(--gold-2)}

/* quiz */
.progress{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-block:32px 8px}
.progress i{height:2px;background:var(--line);display:block;transition:background .3s}
.progress i.on{background:var(--gold)}
.step{padding-block:24px 8px;display:flex;flex-direction:column;gap:22px;max-width:760px}
.step .hint{color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{appearance:none;text-align:left;background:var(--panel);border:1px solid var(--line);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,background .2s;border-radius:1px}
.opt:hover{border-color:var(--dim)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--gold);background:var(--panel-2)}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt[aria-checked="true"] .t{color:var(--gold-2)}
.pick-count{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
h2:focus{outline:none}
.opt .t{font-size:16px;font-weight:400}
.opt .s{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"] .t{color:var(--gold-2)}
.pairs{display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:stretch}
.pair .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);align-self:center}
textarea,input[type=text],input[type=tel]{width:100%;background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:1px;font-size:16px;font-weight:300;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,input:focus{border-color:var(--gold);outline:none}
.counter{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.nav{display:flex;justify-content:space-between;gap:12px;padding-block:28px 0;max-width:760px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.note{font-size:13px;color:var(--dim);border-left:1px solid var(--gold);padding-left:12px}

/* result */
.result{display:grid;grid-template-columns:1fr 340px;gap:32px;padding-block:40px 0;align-items:start}
.result .ficha{padding:36px}
.result h2{font-size:clamp(34px,5vw,52px)}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.cta{background:var(--cream);color:var(--ink);padding:28px;display:flex;flex-direction:column;gap:14px}
.cta .eyebrow{color:#7A5F2A}
.cta h3{font-size:28px;line-height:1.1}
.cta p{font-size:15px;color:#4A4336}
.cta .btn{background:var(--ink);border-color:var(--ink);color:var(--cream);text-align:center;text-decoration:none;display:block}
.cta .btn:hover{background:#2A251C}
.cta .btn.ig{background:transparent;color:var(--ink);border-color:#B9AE98}
.cta .btn.ig:hover{background:rgba(15,14,11,.06);border-color:var(--ink)}
.ig-top{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--cream);text-decoration:none;border:1px solid var(--line);padding:5px 10px;white-space:nowrap}
.ig-top:hover{border-color:var(--gold);color:var(--gold-2)}
.top-r{display:flex;gap:10px;align-items:center}
@media (max-width:420px){.ig-top .lbl{display:none}}
.small{font-size:13px;color:var(--dim)}
.ai{border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:12px}
.ai-title{font-size:24px;line-height:1.2}
.ai-lead{color:var(--muted);font-size:15px}
.ai-bridge{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ai-bridge p{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.35;color:var(--gold-2)}
@media (max-width:600px){.ai-title{font-size:21px}.ai-bridge p{font-size:17px}}
.ai-out{font-family:var(--display);font-size:18px;line-height:1.45;white-space:pre-wrap}
.ai-out:empty{display:none}
.ai-out.thinking{font-family:var(--mono);font-size:12px;color:var(--dim)}
.divider{height:1px;background:var(--line)}
.flink{color:var(--muted)}
.flink:hover{color:var(--gold-2)}
.check a,.note a{color:var(--gold-2)}
/* contacto dentro del CTA */
.cta .field label,.cta .field .lbl2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5C5446}
.cta input[type=text]{background:#FFFDF8;border-color:#CFC4AE;color:var(--ink)}
.cta input[type=text]::placeholder{color:#8A806C}
.cta input[type=text]:focus{border-color:#7A5F2A}
.cta .opts{grid-template-columns:1fr}
.cta .opt{background:#FFFDF8;border-color:#CFC4AE;color:var(--ink);padding:10px 14px}
.cta .opt:hover{border-color:#7A5F2A}
.cta .opt[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.cta .opt[aria-checked="true"] .t{color:var(--cream)}
.cta .check{color:#4A4336;font-size:13px}
.cta .check input{color-scheme:light}
.cta .check a{color:#7A5F2A}
.cta .btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.cta-what{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#4A4336}
.cta-what li::before{content:"— ";color:#7A5F2A}
.price{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#5C5446}
.wa-pdf{color:var(--gold-2)}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--gold)}
details.more[open] summary::before{content:"− "}
details.more .legend{margin-top:14px}
/* barra fija en móvil */
.mbar{display:none}
@media (max-width:820px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(15,14,11,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);transition:transform .25s,opacity .25s}
  .mbar.off{transform:translateY(110%);opacity:0;pointer-events:none}
  .mbar span{font-size:13px;color:var(--muted);line-height:1.3}
  .mbar span b{display:block;color:var(--cream);font-weight:400}
  .mbar .btn{flex:none;padding:11px 16px;font-size:14px;border-radius:999px}
  body.has-mbar{padding-bottom:96px}
}
@media (prefers-reduced-motion:reduce){.mbar{transition:none}}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}

.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.ficha.sample{transform:none}}

@media (max-width:820px){
  .intro{grid-template-columns:1fr;gap:40px;padding-block:36px 12px}
  .intro-copy{position:static;padding-top:0}
  .result{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:600px){
  body{font-size:15px;padding-block:0 32px}
  .top{padding-block:14px}
  .brand .sub,.proto{display:none}
  .brand{font-size:10.5px;letter-spacing:.18em}
  .ig-top{font-size:10px;padding:4px 8px;letter-spacing:.06em}
  h1{font-size:clamp(40px,11.5vw,48px);line-height:1.02;letter-spacing:-.015em}
  h1 em{display:inline-block}
  h2{font-size:23px;line-height:1.18}
  .lead{font-size:15px;line-height:1.6}
  .intro .eyebrow{font-size:10px;letter-spacing:.18em}
  .meta{font-size:11px;gap:10px}
  .intro{gap:28px;padding-block:28px 8px}
  .intro-copy{gap:16px}
  .btn{padding:12px 18px;font-size:14px}
  .actions .btn{flex:1 1 100%;text-align:center}
  .start-wrap{align-items:stretch}
  .btn-start{width:100%;padding:16px 22px;font-size:16px}
  .start-note{text-align:center}
  .progress{padding-block:18px 4px;gap:4px}
  .step{padding-block:14px 4px;gap:14px}
  .step .hint{font-size:14px}
  .opts{grid-template-columns:1fr 1fr;gap:8px}
  .opts.long{grid-template-columns:1fr}
  .opt{padding:11px 13px;gap:2px}
  .opt .t{font-size:14.5px}
  .opt .s{font-size:12px;line-height:1.35}
  .pairs{gap:12px}
  .pair{grid-template-columns:1fr 1fr;gap:8px}
  .pair .k{grid-column:1/-1;font-size:10px}
  .fields{grid-template-columns:1fr}
  textarea,input[type=text]{font-size:16px;padding:12px 14px}
  .check{font-size:13px}
  .note{font-size:12px}
  .nav{padding-block:20px 0}
  .nav .btn{flex:1}
  .ficha,.result .ficha{padding:18px;gap:14px}
  .ficha .tag{left:16px}
  .result{gap:22px;padding-block:24px 0}
  .result h2{font-size:28px}
  .quote{font-size:18px}
  .row{grid-template-columns:1fr;gap:2px}
  .row .k{font-size:9.5px}
  .row .v{font-size:14.5px;line-height:1.5}
  .mosaic{height:130px}
  .mosaic span{font-size:9.5px;left:6px;bottom:4px}
  .lg{grid-template-columns:28px 38px 1fr;gap:8px}
  .lg i{height:18px}
  .lg .pct{font-size:12px;line-height:18px}
  .lg .nm{font-size:13.5px}
  .lg .nm small{font-size:9.5px}
  .cta{padding:20px;gap:12px}
  .cta h3{font-size:23px}
  .cta p{font-size:14px}
  .ficha.sample{transform:none}
  .ficha-head{gap:8px}
  .ficha-head .eyebrow{font-size:10px;letter-spacing:.16em}
  .code{white-space:nowrap;font-size:10px}
  footer{margin-top:40px;flex-direction:column;gap:8px;font-size:10px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Claudia Arriola</b><span class="sub"> · espacios con IA</span></div>
    <div class="top-r">
      <a class="ig-top" href="https://www.instagram.com/claudiaarriola.ia/" target="_blank" rel="noopener" aria-label="Instagram de Claudia Arriola"><span class="lbl">Instagram </span>@claudiaarriola.ia</a>
      <div class="proto" title="Versión beta">Beta</div>
    </div>
  </header>
  <main id="app">

function readDesc(text){
  const t=(text||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  if(!t.trim()) return [];
  // Words that only repeat the business type (café in a cafetería) count last: the rest of the story is what makes it personal
  const obvious = {cafeteria:["cafe"], bar:["noche"], salon:["bienestar"], estudio:["trabajo"]}[S.business] || [];
  const found = LEX.map(e=>{ const m=t.match(e.re); return m?{e, at:m.index + (obvious.includes(e.id)?1e4:0)}:null; }).filter(Boolean);
  // A more specific theme replaces its general one
  const ids = found.map(x=>x.e.id);
  return found.filter(x=>!(x.e.id==="cafe" && ids.includes("especialidad")) && !(x.e.id==="noche" && ids.includes("cerveza"))).sort((a,b)=>a.at-b.at).slice(0,3).map(x=>x.e);
}

function hsl(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  let h=0, s=0;
  if(d){ s=d/(1-Math.abs(2*l-1)); h = mx===r?((g-b)/d)%6 : mx===g?(b-r)/d+2 : (r-g)/d+4; h=(h*60+360)%360; }
  return {h,s,l};
}
function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rand(seed,i){ let x=(seed ^ Math.imul(i+1,2654435761))>>>0; x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return (x%10000)/10000; }
function pickN(arr,n,seed,salt){ return arr.map((v,i)=>[v,rand(seed,i+salt)]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]); }

function scoreColor(c, idx, seed){
  const [hex,,role,tagStr]=c, tags=tagStr.split(" "), {h,s,l}=hsl(hex);
  if(tagStr.startsWith("desc:")){ const id=tagStr.slice(5); if(!STORY.ids.includes(id)) return -1e9; }
  const warm = s>0.12 && (h<75 || h>330), cool = s>0.12 && h>=150 && h<=300;
  let sc = 0;
  if(tags.includes(S.first)) sc+=3;
  if(tags.includes(S.after)) sc+= role==="A" ? 3.6 : 2.2;
  if(S.pairs.luz==="tarde"){ if(warm) sc+=1.2; if(cool) sc-=0.6; } else { if(cool) sc+=0.7; if(role==="G" && l>0.9) sc+=0.6; }
  if(S.pairs.ritmo==="dinamico"){ if(role==="A") sc+=s*2; } else { if(s<0.35) sc+=0.6; else if(role==="A") sc-=s; }
  if(S.pairs.tacto==="pulido"){ if(role==="D") sc+=(0.3-l)*4; if(role==="G") sc+=(l-0.85)*4; }
  else { if(role==="E" && s>0.15 && s<0.5) sc+=0.7; }
  if(S.avoid.includes("frio") && cool && role!=="A") sc-=2;
  if(S.avoid.includes("barato") && s>0.6) sc-=1;
  if(S.avoid.includes("pretencioso") && tags.includes("lujo")) sc-=2.5;
  if(S.avoid.includes("generico") && tags.includes("comun")) sc-=2;
  if(S.avoid.includes("caotico") && role==="A" && s>0.55) sc-=1.2;
  if(S.avoid.includes("aburrido") && role==="A") sc+=s;
  if(tagStr.startsWith("desc:")) sc += 9.5 - STORY.ids.indexOf(tagStr.slice(5))*1.2;
  return sc + rand(seed, idx)*2.2;
}

const HARM_TXT = {
  tonal: "Armonía tonal: variaciones de una misma familia de color, sin saltos bruscos.",
  analoga: "Armonía análoga: colores vecinos que comparten subtono, con transiciones suaves.",
  compl: "Armonía complementaria suavizada: el protagonista es el opuesto del tono base, pero apagado, para dar carácter sin contrastar."
};
function chroma(hex){ const n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255; return (Math.max(r,g,b)-Math.min(r,g,b))/255; }
function palette(seed){
  let best=null, bs=-1e9;
  PALETTES.forEach((p,i)=>{
    const t=p.t.split(" "); let sc=0;
    // 1) Tipo de comercio: el criterio principal
    const firstTheme = STORY.ids.length && t.includes(STORY.ids[0]);
    if(S.business!=="otro"){ if(t.includes("b:"+S.business)) sc+=10; else if(firstTheme) sc+=6; else sc-=6; }
    // 2) Historia del negocio y personalidad de marca
    STORY.ids.forEach((id,k)=>{ if(t.includes(id)) sc += k===0 ? 8 : 3.5; });
    if(t.includes("solo") && !STORY.ids.some(id=>t.includes(id))) sc-=5;   // paletas temáticas: solo si la historia lo pide
    if(t.includes(S.first)) sc+=3;
    if(t.includes(S.after)) sc+=1.5;
    if(t.includes(S.pairs.luz)) sc+=1;
    if(t.includes(S.pairs.tacto)) sc+=1;
    // 3) Color de la mercancía (tiendas): el espacio no compite con el producto
    if(S.business==="tienda" && S.merch){
      const ch=(chroma(p.c[1][0])+chroma(p.c[2][0]))/2;
      if(S.merch==="mucho"){ sc += p.h==="tonal" ? 3 : -2; sc -= ch*12; if(hsl(p.c[0][0]).l<0.35) sc-=2; }
      else if(S.merch==="algo"){ sc += p.h==="compl" ? -1 : 1; sc -= ch*5; }
      else { sc += p.h==="tonal" ? 0 : 1.2; }
    }
    // 4) Lo que no debe transmitir
    const temp = t.includes("w") ? "w" : t.includes("c") ? "c" : "n";
    if(S.avoid.includes("frio") && temp==="c") sc-=3;
    if(S.avoid.includes("pretencioso") && t.includes("lujo")) sc-=3;
    if(S.avoid.includes("aburrido") && p.h==="tonal") sc-=1.2;
    if(S.avoid.includes("caotico") && p.h==="compl") sc-=0.8;
    if(S.avoid.includes("generico") && ["Hueso y carbón","Galería nude","Refugio gris"].includes(p.n)) sc-=1.5;
    sc += rand(seed, i+500)*1.4;
    if(sc>bs){ bs=sc; best=p; }
  });
  const pal = best.c.map(c=>[c[0], c[1], false]);
  pal.pname = best.n;
  pal.harmony = HARM_TXT[best.h];
  pal.crit = BIZ_CRIT[S.business] + (S.business==="tienda" && S.merch==="mucho" ? " Como tus productos tienen mucho color, la paleta se mantiene neutra para que ellos sean los protagonistas." : S.business==="tienda" && S.merch==="neutro" ? " Como tus productos son de tonos neutros, el espacio puede aportar más identidad de color." : "");
  pal.themes = STORY.ids.filter(id=>best.t.split(" ").includes(id));
  return pal;
}

/* ---------- State ---------- */
const S = {step:0, business:null, merch:null, first:null, avoid:[], after:null, pairs:{luz:null,ritmo:null,tacto:null}, desc:"", name:"", stage:null, consent:false, marketing:false};
const TOTAL = 6; // 6 preguntas; el resultado se muestra sin pedir datos
const app = document.getElementById("app");
const KEY = "adn-espacial-v2";

/* ---------- Progreso guardado en esta pestaña (se borra al cerrarla) ---------- */
function save(){ try{ sessionStorage.setItem(KEY, JSON.stringify({S, sid:SID, seen:[...SEEN]})); }catch(e){} }
function restore(){
  try{
    const d = JSON.parse(sessionStorage.getItem(KEY)||"null");
    if(!d || !d.S) return null;
    Object.assign(S, d.S); (d.seen||[]).forEach(x=>SEEN.add(x));
    return d.sid || null;
  }catch(e){ return null; }
}

/* ---------- Estadísticas anónimas (sin nombre ni contacto) ---------- */
const SEEN = new Set();
let SID = Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
function trackOnce(event, data){ if(SEEN.has(event)) return; SEEN.add(event); track(event, data); save(); }
function track(event, data){
  if(!WORKER_URL) return;
  try{
    fetch(WORKER_URL.replace(/\/$/,"") + "/log", {method:"POST", keepalive:true, headers:{"Content-Type":"application/json"},
      body: JSON.stringify(Object.assign({id:SID, event}, data||{}))}).catch(()=>{});
  }catch(e){}
}

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content; }
function progress(){ let h='<div class="progress" aria-hidden="true">'; for(let i=1;i<=TOTAL;i++) h+=`<i class="${i<=S.step?'on':''}"></i>`; return h+'</div>'; }
/* Elección única = radio; elección múltiple = botón conmutable */
function optBtn(group,o,on,multi,disabled){
  const state = multi ? `aria-pressed="${on}"` : `role="radio" aria-checked="${on}"`;
  return `<button type="button" class="opt" data-g="${group}" data-v="${o.id}" ${state}${disabled?' aria-disabled="true"':''}><span class="t">${esc(o.t)}</span>${o.s?`<span class="s">${esc(o.s)}</span>`:""}</button>`;
}
function radios(label, html, cls){ return `<div class="opts ${cls||""}" role="radiogroup" aria-label="${esc(label)}">${html}</div>`; }
function loadScript(src){
  return new Promise((ok,fail)=>{
    if(document.querySelector(`script[src="${src}"]`)?.dataset.ready) return ok();
    const s=document.createElement("script"); s.src=src; s.async=true;
    s.onload=()=>{ s.dataset.ready="1"; ok(); }; s.onerror=()=>{ s.remove(); fail(new Error("load")); };
    document.head.appendChild(s);
  });
}

/* ---------- Engine ---------- */
function build(){
  const base = ARCH[S.first];
  const biz = BUSINESS.find(b=>b.id===S.business);
  const after = AFTER.find(x=>x.id===S.after);
  const seed = hashStr([S.business,S.first,S.after,S.avoid.join(","),S.pairs.luz,S.pairs.ritmo,S.pairs.tacto,(S.desc||"").trim().toLowerCase()].join("|"));
  let k = base.k + (S.pairs.luz==="tarde" ? -150 : 350) + (S.pairs.tacto==="pulido" ? 50 : 0);
  k = Math.max(2400, Math.min(4000, Math.round(k/50)*50));
  const story = readDesc(S.desc); STORY = {ids: story.map(e=>e.id)};
  const t = S.pairs.tacto, other = t==="natural" ? "pulido" : "natural";
  const quiet = m => !(S.business==="tienda" && S.merch==="mucho" && /color|brillante|pintad/i.test(m));  // con mercancía colorida, materiales sobrios
  const main = pickN(MATS[S.first][t].filter(quiet),2,seed,11);
  const firstWords = main.map(m=>m.split(" ")[0]);
  const extra = pickN(MATS[S.first][other].filter(m=>quiet(m) && !firstWords.includes(m.split(" ")[0])),1,seed,23);
  const storyMats = story.map(e=>pickN(e.mats,1,seed,61)[0]).slice(0,2);
  let mats = (storyMats.length===0 ? [...main, ...extra] : storyMats.length===1 ? [main[0], storyMats[0], main[1]] : [main[0], ...storyMats]).filter(Boolean);
  const reserve = [...main, ...extra, ...MATS[S.first][t], ...MATS[S.first][other]].filter(quiet);
  mats = [...new Set(mats)];
  for(const m of reserve){ if(mats.length>=3) break; if(!mats.includes(m)) mats.push(m); }
  mats = mats.slice(0,3);
  const noun = pickN(base.nouns,1,seed,31)[0];
  const a = {
    name: noun+" "+LIGHT_NAME[S.pairs.luz][t],
    atm: [pickN(base.atm,1,seed,41)[0], AFTER_ATM[S.after], LIGHT_ATM[S.pairs.luz][t]].join(" · "),
    persona: base.persona, lightTxt: base.lightTxt,
    memo: story.length ? story[0].memo : pickN(base.memo,1,seed,51)[0],
    pal: palette(seed)
  };
  const storyCols = a.pal.filter(p=>p[2]).map(p=>p[1]);
  const used = story.filter((e,i)=> i<2 || e.colors.some(c=>storyCols.includes(c[1])));
  const bits = []; [...(a.pal.themes.length?["la paleta de color"]:[]), ...storyMats.map(m=>m.toLowerCase())].forEach(b=>{ if(!bits.some(x=>x.toLowerCase()===b.toLowerCase())) bits.push(b); });
  const andJoin = arr => arr.join(", ").replace(/, ([^,]*)$/," y $1");
  const storyLine = !S.desc.trim() ? "" : story.length
    ? `Leí ${andJoin(used.map(e=>e.label))} en tu descripción. De ahí salen ${andJoin(bits)}.`
    : "Tu descripción afinó la combinación de tonos y materiales. Si nombras el barrio, el producto o la historia del negocio, la ficha se vuelve aún más tuya.";
  const recorrido = S.pairs.ritmo==="pausado"
    ? "Por estaciones: rincones con distinta intensidad para que cada quien encuentre su lugar"
    : "Fluido: una circulación clara con un punto central donde la gente se cruza";
  const avoid = S.avoid.map(id=>AVOID.find(x=>x.id===id).rule);
  return {a, biz, after, k, mats, recorrido, avoid, storyLine, code:"ADN-"+String(seed%10000).padStart(4,"0")};
}

function inkOn(hex){ const {l}=hsl(hex); return l>0.6 ? "rgba(20,18,14,.75)" : "rgba(255,255,255,.85)"; }
function mosaicHTML(pal){
  const cls=["m60","m20","m10","mA"];
  return `<div class="mosaic" role="img" aria-label="Proporción de la paleta: ${pal.map((p,i)=>PROP[i].pct+"% "+p[1]).join(", ")}">${pal.map((p,i)=>`<div class="${cls[i]}" style="background:${p[0]}"><span style="color:${inkOn(p[0])}">${PROP[i].pct}%</span></div>`).join("")}</div>`;
}

const MERCH = [{id:"mucho",t:"Mucho color",s:"Ropa, juguetes, cómics, empaques vivos"},{id:"algo",t:"Algo de color",s:"Una mezcla de tonos"},{id:"neutro",t:"Tonos neutros",s:"Joyería, cerámica, piezas sobrias"}];
const STAGES = [{id:"abrir",t:"Voy a abrir"},{id:"renovar",t:"Quiero renovar"},{id:"explorar",t:"Solo estoy explorando"}];
const andJoin = arr => arr.join(", ").replace(/, ([^,]*)$/," y $1");

function validStep(k){
  switch(k){
    case 1: return !!S.business && (S.business!=="tienda" || !!S.merch);
    case 2: return !!S.first;
    case 3: return S.avoid.length>0;
    case 4: return !!S.after;
    case 5: return Object.values(S.pairs).every(Boolean);
    default: return true;
  }
}

function stepScreen(opts){
  opts = opts||{};
  let body="", title="", hint="";
  switch(S.step){
    case 1: title="Tu negocio es…"; hint="Elige el que más se acerque.";
      body = radios("Tipo de negocio", BUSINESS.map(o=>optBtn("business",o,S.business===o.id)).join(""))

      break;

      body = radios("Primera impresión", FIRST.map(o=>optBtn("first",o,S.first===o.id)).join(""), "long"); break;
    case 3: {
      title="¿Qué no debería transmitir nunca?"; hint="Elige una o dos.";
      const full = S.avoid.length>=2;
      body = `<div class="opts" role="group" aria-label="Lo que no debe transmitir">${AVOID.map(o=>optBtn("avoid",o,S.avoid.includes(o.id),true, full && !S.avoid.includes(o.id))).join("")}</div>
      <p class="pick-count" aria-live="polite">${S.avoid.length} de 2 elegidas${full?" · toca una elegida para cambiarla":""}</p>`;
      break; }

      body = radios("Cómo se siente al salir", AFTER.map(o=>optBtn("after",o,S.after===o.id)).join("")); break;
    case 5: title="Si tu marca fuera un lugar…"; hint="Elige un lado en cada par, sin pensarlo mucho.";
      body = `<div class="pairs">${PAIRS.map(p=>`<div class="pair" role="radiogroup" aria-label="${esc(p.k)}"><span class="k" aria-hidden="true">${p.k}</span>${optBtn("pair:"+p.id,p.a,S.pairs[p.id]===p.a.id)}${optBtn("pair:"+p.id,p.b,S.pairs[p.id]===p.b.id)}</div>`).join("")}</div>`;

      break;
  }
  const valid = validStep(S.step);

    <button class="btn" id="next" ${valid?"":"disabled"}>${S.step===TOTAL?"Ver mi ADN Espacial":"Siguiente"}</button>

function bindStep(){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.getAttribute("aria-disabled")==="true"){
      const pc=app.querySelector(".pick-count"); if(pc) pc.textContent="Ya elegiste dos. Toca una de las elegidas para quitarla.";
      return;
    }
    const g=b.dataset.g, v=b.dataset.v;
    if(g==="avoid"){
      const i=S.avoid.indexOf(v);
      if(i>=0) S.avoid.splice(i,1); else if(S.avoid.length<2) S.avoid.push(v);
    } else if(g.startsWith("pair:")) S.pairs[g.slice(5)]=v;
    else S[g]=v;
    const pairsDone = g.startsWith("pair:") && Object.values(S.pairs).every(Boolean);
    const auto = (g==="business" && v!=="tienda") || g==="first" || g==="after" || g==="merch" || pairsDone;
    const cur = S.step;
    save();
    stepScreen({keep:[g,v]});
    if(auto) setTimeout(()=>{ if(S.step===cur) go(cur+1); }, pairsDone?420:260);
  });
  const d=document.getElementById("desc");
  if(d) d.oninput=()=>{ S.desc=d.value; document.getElementById("cnt").textContent=d.value.length; save(); };
  document.getElementById("back").onclick=()=>go(S.step-1);
  document.getElementById("next").onclick=()=>go(S.step+1);
}

/* ---------- Barra fija en móvil hasta que se ve el bloque de contacto ---------- */
let mbarObs=null;
function mbarOff(){
  document.body.classList.remove("has-mbar");
  const m=document.getElementById("mbar"); m.classList.add("off"); m.setAttribute("aria-hidden","true");
  document.getElementById("mbar-btn").tabIndex=-1;
  if(mbarObs){ mbarObs.disconnect(); mbarObs=null; }
}
function mbarOn(){
  const m=document.getElementById("mbar"), cta=document.getElementById("cta"), b=document.getElementById("mbar-btn");
  if(!cta || !("IntersectionObserver" in window)) return;
  document.body.classList.add("has-mbar");
  mbarObs = new IntersectionObserver(es=>{
    const vis = es[0].isIntersecting;
    m.classList.toggle("off", vis); m.setAttribute("aria-hidden", vis?"true":"false"); b.tabIndex = vis?-1:0;
  }, {threshold:0.12});
  mbarObs.observe(cta);
  b.onclick=()=>{
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    cta.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"});
    setTimeout(()=>{ const i=document.getElementById("name"); if(i) i.focus({preventScroll:true}); }, reduce?0:450);
    track("barra_cta");
  };
}

function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function fileBase(){ return (S.name.trim().split(/\s+/)[0]||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,""); }

/* ---------- Imagen 1080×1920 para historias de Instagram ---------- */
function wrapLines(ctx, text, maxW){
  const words=String(text).split(/\s+/), lines=[]; let line="";
  words.forEach(w=>{ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; });
  if(line) lines.push(line); return lines;
}
async function shareStory(r){

    const W=1080, H=1920, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const ctx=cv.getContext("2d"), X=90, CWD=W-2*X;
    const sp=(v)=>{ if("letterSpacing" in ctx) ctx.letterSpacing=v; };
    ctx.fillStyle="#0F0E0B"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#2F2A20"; ctx.lineWidth=2; ctx.strokeRect(48,48,W-96,H-96);
    // Encabezado
    ctx.textBaseline="alphabetic";
    ctx.font='400 26px "DM Mono", monospace'; sp("6px"); ctx.fillStyle="#C8A45E"; ctx.fillText("ADN ESPACIAL", X, 170);
    ctx.textAlign="right"; ctx.fillStyle="#8C8372"; ctx.fillText(r.code, W-X, 170); ctx.textAlign="left"; sp("0px");
    ctx.fillStyle="#2F2A20"; ctx.fillRect(X,200,CWD,2);
    let y=300;
    ctx.font='300 36px "Jost", sans-serif'; ctx.fillStyle="#A69C88"; ctx.fillText(r.biz.t, X, y); y+=50;
    ctx.font='500 116px "Bodoni Moda", serif'; ctx.fillStyle="#EEE6D5";
    wrapLines(ctx, r.a.name, CWD).forEach(l=>{ y+=118; ctx.fillText(l, X, y); });
    y+=90;
    ctx.font='italic 600 54px "Bodoni Moda", serif'; ctx.fillStyle="#E2C58A";
    wrapLines(ctx, FIRST.find(f=>f.id===S.first).t, CWD).forEach(l=>{ ctx.fillText(l, X, y); y+=64; });
    y+=10;

    // Mosaico de paleta (mismas proporciones que la ficha)
    y+=40; const mh=440, pal=r.a.pal, g=6;
    const w60=CWD*0.6-g, w30=CWD*0.3-g, w10=CWD*0.1;
    const box=(hex,x,yy,w,h,label)=>{ ctx.fillStyle=hex; ctx.fillRect(x,yy,w,h); ctx.font='400 24px "DM Mono", monospace'; ctx.fillStyle=hsl(hex).l>0.6?"rgba(20,18,14,.75)":"rgba(255,255,255,.85)"; ctx.fillText(label, x+16, yy+h-18); };
    box(pal[0][0], X, y, w60, mh, "60%");
    box(pal[1][0], X+w60+g, y, w30, mh*2/3-g/2, "20%");
    box(pal[2][0], X+w60+g, y+mh*2/3+g/2, w30, mh/3-g/2, "10%");

    // Cierre

    ctx.font='400 26px "DM Mono", monospace'; sp("2px"); ctx.fillStyle="#EEE6D5"; ctx.fillText(SITE_URL, X, by+70);
    ctx.fillStyle="#8C8372"; ctx.fillText("@claudiaarriola.ia", X, by+112); sp("0px");
    const blob = await new Promise(res=>cv.toBlob(res,"image/png"));
    if(!blob) throw new Error("blob");
    const fname = "ADN-Espacial-historia" + (fileBase()?"-"+fileBase():"") + ".png";
    const file = new File([blob], fname, {type:"image/png"});
    let shared=false;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"Mi ADN Espacial", text:"Descubre el tuyo en "+SITE_URL}); shared=true; }
      catch(e){ if(e && e.name==="AbortError"){ note.textContent=""; btn.disabled=false; return; } }
    }
    if(!shared){
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    note.textContent = shared ? "¡Listo! Si la subes a tus historias, etiqueta a @claudiaarriola.ia." : "Imagen descargada. Súbela a tus historias y etiqueta a @claudiaarriola.ia.";
    track("compartir");
  }catch(e){
    note.textContent="No se pudo preparar la imagen en este navegador. Puedes descargar tu ficha en PDF.";
  }
  btn.disabled=false;
}

/* ---------- Navegación con historial: el botón «atrás» del navegador funciona ---------- */
function render(){
  if(S.step===0) intro();
  else if(S.step<=TOTAL) stepScreen();
  else result();
}
function go(n, opts){
  opts = opts||{};
  n = Math.max(0, Math.min(TOTAL+1, n));
  for(let k=1; k<n && k<=TOTAL; k++){ if(!validStep(k)){ n=k; break; } }
  S.step = n;
  if(!opts.fromHistory){
    try{ history[opts.replace?"replaceState":"pushState"]({step:n}, "", n===0 ? location.pathname+location.search : "#"+(n>TOTAL?"resultado":"p"+n)); }catch(e){}
  }
  mbarOff();
  render();
  if(n>=1 && n<=TOTAL) trackOnce("paso_"+n);
  save();
  window.scrollTo(0,0);
  if(n>0){ const h=document.getElementById("q"); if(h) h.focus({preventScroll:true}); }
}
window.addEventListener("popstate", e=>{ go(e.state && typeof e.state.step==="number" ? e.state.step : 0, {fromHistory:true}); });

const savedSid = restore();
if(savedSid) SID = savedSid;
go(S.step||0, {replace:true});
})();
</script>
