<style>
:root{
  color-scheme: dark;
  --ink:#0F0E0B; --panel:#17150F; --panel-2:#1E1B14; --line:#2F2A20;
  --cream:#EEE6D5; --muted:#A69C88; --dim:#6F6756;
  --gold:#C8A45E; --gold-2:#E2C58A; --gold-ink:#1A150B;
  --display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --body:"Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);margin:0}
img{max-width:100%}
body{color:var(--cream);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:22px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--cream);font-weight:400}
.proto{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:4px 8px;border-radius:2px;white-space:nowrap}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,7vw,72px);line-height:1.02;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--gold-2)}
h2{font-size:clamp(28px,4.4vw,40px);line-height:1.1}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:52ch}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:56px 24px}
.intro-copy{display:flex;flex-direction:column;gap:22px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.btn{appearance:none;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);padding:14px 26px;font-size:15px;font-weight:500;letter-spacing:.04em;cursor:pointer;border-radius:1px;transition:background .2s,color .2s}
.btn:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ficha (result sheet) */
.ficha{background:var(--panel);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:20px;position:relative}
.ficha.sample{transform:rotate(-1.2deg);box-shadow:0 30px 60px -30px #000}
.ficha .tag{position:absolute;top:-11px;left:24px;background:var(--ink);padding:0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.ficha-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.code{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
.row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline}
.row .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:15.5px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw i{display:block;aspect-ratio:1/1.15;border:1px solid rgba(255,255,255,.06)}
.sw span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.3}
.quote{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.25;color:var(--gold-2)}

/* quiz */
.progress{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-block:32px 8px}
.progress i{height:2px;background:var(--line);display:block;transition:background .3s}
.progress i.on{background:var(--gold)}
.step{padding-block:24px 8px;display:flex;flex-direction:column;gap:22px;max-width:760px}
.step .hint{color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{appearance:none;text-align:left;background:var(--panel);border:1px solid var(--line);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,background .2s;border-radius:1px}
.opt:hover{border-color:var(--dim)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2)}
.opt .t{font-size:16px;font-weight:400}
.opt .s{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"] .t{color:var(--gold-2)}
.pairs{display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:stretch}
.pair .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);align-self:center}
textarea,input[type=text],input[type=tel]{width:100%;background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:1px;font-size:16px;font-weight:300;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,input:focus{border-color:var(--gold);outline:none}
.counter{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.nav{display:flex;justify-content:space-between;gap:12px;padding-block:28px 0;max-width:760px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.note{font-size:13px;color:var(--dim);border-left:1px solid var(--gold);padding-left:12px}

/* result */
.result{display:grid;grid-template-columns:1fr 340px;gap:32px;padding-block:40px 0;align-items:start}
.result .ficha{padding:36px}
.result h2{font-size:clamp(34px,5vw,52px)}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.cta{background:var(--cream);color:var(--ink);padding:28px;display:flex;flex-direction:column;gap:14px}
.cta .eyebrow{color:#7A5F2A}
.cta h3{font-size:28px;line-height:1.1}
.cta p{font-size:15px;color:#4A4336}
.cta .btn{background:var(--ink);border-color:var(--ink);color:var(--cream);text-align:center;text-decoration:none;display:block}
.cta .btn:hover{background:#2A251C}
.small{font-size:13px;color:var(--dim)}
.ai{border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:12px}
.ai-out{font-family:var(--display);font-size:18px;line-height:1.45;white-space:pre-wrap}
.ai-out:empty{display:none}
.ai-out.thinking{font-family:var(--mono);font-size:12px;color:var(--dim)}
.divider{height:1px;background:var(--line)}
.flink{color:var(--muted)}
.flink:hover{color:var(--gold-2)}
.check a{color:var(--gold-2)}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}

.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.ficha.sample{transform:none}}

@media (max-width:820px){
  .intro{grid-template-columns:1fr;gap:40px;padding-block:36px 12px}
  .result{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:520px){
  .row{grid-template-columns:1fr;gap:4px}
  .pair{grid-template-columns:1fr 1fr}
  .pair .k{grid-column:1/-1}
  .fields{grid-template-columns:1fr}
  .ficha,.result .ficha{padding:22px}
  .swatches{gap:6px}
}
</style>
</head>

function readDesc(text){
  const t=(text||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  if(!t.trim()) return [];
  // Words that only repeat the business type (café in a cafetería) count last: the rest of the story is what makes it personal
  const obvious = {cafeteria:["cafe"], bar:["noche"], salon:["bienestar"], estudio:["trabajo"]}[S.business] || [];
  const found = LEX.map(e=>{ const m=t.match(e.re); return m?{e, at:m.index + (obvious.includes(e.id)?1e4:0)}:null; }).filter(Boolean);
  // A more specific theme replaces its general one
  const ids = found.map(x=>x.e.id);
  return found.filter(x=>!(x.e.id==="cafe" && ids.includes("especialidad")) && !(x.e.id==="noche" && ids.includes("cerveza"))).sort((a,b)=>a.at-b.at).slice(0,3).map(x=>x.e);
}

function hsl(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  let h=0, s=0;
  if(d){ s=d/(1-Math.abs(2*l-1)); h = mx===r?((g-b)/d)%6 : mx===g?(b-r)/d+2 : (r-g)/d+4; h=(h*60+360)%360; }
  return {h,s,l};
}
function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rand(seed,i){ let x=(seed ^ Math.imul(i+1,2654435761))>>>0; x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return (x%10000)/10000; }
function pickN(arr,n,seed,salt){ return arr.map((v,i)=>[v,rand(seed,i+salt)]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]); }

function scoreColor(c, idx, seed){
  const [hex,,role,tagStr]=c, tags=tagStr.split(" "), {h,s,l}=hsl(hex);
  if(tagStr.startsWith("desc:")){ const id=tagStr.slice(5); if(!STORY.ids.includes(id)) return -1e9; }
  const warm = s>0.12 && (h<75 || h>330), cool = s>0.12 && h>=150 && h<=300;
  let sc = 0;
  if(tags.includes(S.first)) sc+=3;
  if(tags.includes(S.after)) sc+= role==="A" ? 3.6 : 2.2;
  if(S.pairs.luz==="tarde"){ if(warm) sc+=1.2; if(cool) sc-=0.6; } else { if(cool) sc+=0.7; if(role==="G" && l>0.9) sc+=0.6; }
  if(S.pairs.ritmo==="dinamico"){ if(role==="A") sc+=s*2; } else { if(s<0.35) sc+=0.6; else if(role==="A") sc-=s; }
  if(S.pairs.tacto==="pulido"){ if(role==="D") sc+=(0.3-l)*4; if(role==="G") sc+=(l-0.85)*4; }
  else { if(role==="E" && s>0.15 && s<0.5) sc+=0.7; }
  if(S.avoid.includes("frio") && cool && role!=="A") sc-=2;
  if(S.avoid.includes("barato") && s>0.6) sc-=1;
  if(S.avoid.includes("pretencioso") && tags.includes("lujo")) sc-=2.5;
  if(S.avoid.includes("generico") && tags.includes("comun")) sc-=2;
  if(S.avoid.includes("caotico") && role==="A" && s>0.55) sc-=1.2;
  if(S.avoid.includes("aburrido") && role==="A") sc+=s;
  if(tagStr.startsWith("desc:")) sc += 9.5 - STORY.ids.indexOf(tagStr.slice(5))*1.2;
  return sc + rand(seed, idx)*2.2;
}
let STORY = {ids:[]};
function palette(seed){
  const pick = (role, allowDesc) => { let best=null, bs=-1e9;
    COLORS.forEach((c,i)=>{ if(c[2]!==role) return; if(!allowDesc && c[3].startsWith("desc:")) return; const v=scoreColor(c,i,seed); if(v>bs){bs=v;best=c;} });
    return best; };
  const roles=["G","E","D","A"];
  let chosen = roles.map(r=>pick(r,true));
  // Keep at least one colour that comes from the buttons, so both sources show
  const fromDesc = chosen.filter(c=>c[3].startsWith("desc:")).length;
  if(fromDesc===4) chosen[0]=pick("G",false);
  return chosen.map(c=>[c[0],c[1],c[3].startsWith("desc:")]);
}

const app = document.getElementById("app");

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content; }
function progress(){ let h='<div class="progress" aria-hidden="true">'; for(let i=1;i<=TOTAL;i++) h+=`<i class="${i<=S.step?'on':''}"></i>`; return h+'</div>'; }
function optBtn(group,o,on){ return `<button type="button" class="opt" data-g="${group}" data-v="${o.id}" aria-pressed="${on}"><span class="t">${esc(o.t)}</span>${o.s?`<span class="s">${esc(o.s)}</span>`:""}</button>`; }

/* ---------- Engine ---------- */
function build(){
  const base = ARCH[S.first];
  const biz = BUSINESS.find(b=>b.id===S.business);
  const after = AFTER.find(x=>x.id===S.after);
  const seed = hashStr([S.business,S.first,S.after,S.avoid.join(","),S.pairs.luz,S.pairs.ritmo,S.pairs.tacto,(S.desc||"").trim().toLowerCase()].join("|"));
  let k = base.k + (S.pairs.luz==="tarde" ? -150 : 350) + (S.pairs.tacto==="pulido" ? 50 : 0);
  k = Math.max(2400, Math.min(4000, Math.round(k/50)*50));
  const story = readDesc(S.desc); STORY = {ids: story.map(e=>e.id)};
  const t = S.pairs.tacto, other = t==="natural" ? "pulido" : "natural";
  const main = pickN(MATS[S.first][t],2,seed,11);
  const firstWords = main.map(m=>m.split(" ")[0]);
  const extra = pickN(MATS[S.first][other].filter(m=>!firstWords.includes(m.split(" ")[0])),1,seed,23);
  const storyMats = story.map(e=>pickN(e.mats,1,seed,61)[0]).slice(0,2);
  const mats = storyMats.length===0 ? [...main, ...extra] : storyMats.length===1 ? [main[0], storyMats[0], main[1]] : [main[0], ...storyMats];
  const noun = pickN(base.nouns,1,seed,31)[0];
  const a = {
    name: noun+" "+LIGHT_NAME[S.pairs.luz][t],
    atm: [pickN(base.atm,1,seed,41)[0], AFTER_ATM[S.after], LIGHT_ATM[S.pairs.luz][t]].join(" · "),
    persona: base.persona, lightTxt: base.lightTxt,
    memo: story.length ? story[0].memo : pickN(base.memo,1,seed,51)[0],
    pal: palette(seed)
  };
  const storyCols = a.pal.filter(p=>p[2]).map(p=>p[1]);
  const used = story.filter((e,i)=> i<2 || e.colors.some(c=>storyCols.includes(c[1])));
  const bits = []; [...storyCols, ...storyMats.map(m=>m.toLowerCase())].forEach(b=>{ if(!bits.some(x=>x.toLowerCase()===b.toLowerCase())) bits.push(b); });
  const andJoin = arr => arr.join(", ").replace(/, ([^,]*)$/," y $1");
  const storyLine = !S.desc.trim() ? "" : story.length
    ? `Leí ${andJoin(used.map(e=>e.label))} en tu descripción. De ahí salen ${andJoin(bits)}.`
    : "Tu descripción afinó la combinación de tonos y materiales. Si nombras el barrio, el producto o la historia del negocio, la ficha se vuelve aún más tuya.";
  const recorrido = S.pairs.ritmo==="pausado"
    ? "Por estaciones: rincones con distinta intensidad para que cada quien encuentre su lugar"
    : "Fluido: una circulación clara con un punto central donde la gente se cruza";
  const avoid = S.avoid.map(id=>AVOID.find(x=>x.id===id).rule);
  return {a, biz, after, k, mats, recorrido, avoid, storyLine, code:"ADN-"+String(seed%10000).padStart(4,"0")};
}

function fichaHTML(r, opts){
  opts = opts||{};
  return `
  <article class="ficha ${opts.sample?'sample':''}" ${opts.sample?'aria-label="Ejemplo de resultado"':''}>
    ${opts.sample?'<span class="tag">Ejemplo · cafetería en Barranco</span>':''}
    <div class="ficha-head"><span class="eyebrow">ADN Espacial · versión inicial</span><span class="code">${r.code}</span></div>
    <div>
      <p class="small" style="margin-bottom:6px">${esc(r.biz.t)}</p>
      <h2>${esc(r.a.name)}</h2>
    </div>
    <p class="quote">${esc(FIRST.find(f=>f.id===S.first||f.id===r.firstId)?.t||"")}</p>
    ${!opts.sample && r.storyLine ? `<div class="row"><span class="k">Tu historia</span><span class="v">${esc(r.storyLine)}</span></div>` : ""}
    <div class="row"><span class="k">Atmósfera</span><span class="v">${esc(r.a.atm)}</span></div>
    <div class="row"><span class="k">Personalidad</span><span class="v">${esc(r.a.persona)}</span></div>
    <div class="row"><span class="k">Materiales</span><span class="v">${r.mats.map(esc).join(" + ")}</span></div>
    <div class="row"><span class="k">Luz</span><span class="v">${r.k} K, ${esc(r.a.lightTxt)}</span></div>
    ${opts.sample?'':`<div class="row"><span class="k">Recorrido</span><span class="v">${esc(r.recorrido)}</span></div>
    <div class="row"><span class="k">Momento clave</span><span class="v">Cuidar ${esc(r.biz.moment)}</span></div>
    <div class="row"><span class="k">Al salir</span><span class="v">${esc(r.after.line)}</span></div>
    <div class="row"><span class="k">Gesto memorable</span><span class="v">${esc(r.a.memo)}</span></div>`}
    <div class="row"><span class="k">Paleta</span><span class="v"></span></div>
    <div class="swatches">${r.a.pal.map((p,i)=>`<div class="sw"><i style="background:${p[0]}"></i><span>${["Fondo","Material","Ancla","Acento"][i]}${p[2]?" · tu historia":""}<br>${esc(p[1])}<br>${p[0]}</span></div>`).join("")}</div>
    ${r.avoid.length?`<div class="row"><span class="k">Evitar</span><span class="v">${r.avoid.map(esc).join(". ")}.</span></div>`:""}
  </article>`;
}

/* ---------- Screens ---------- */
function intro(){
  const saved = JSON.parse(JSON.stringify(S));
  Object.assign(S,{business:"cafeteria",first:"refugio",after:"relajado",avoid:["frio"],pairs:{luz:"tarde",ritmo:"pausado",tacto:"natural"}});
  const r = build(); r.firstId="refugio";
  const sample = fichaHTML(r,{sample:true});
  Object.assign(S, saved);
  app.innerHTML = `
  <section class="intro fade">
    <div class="intro-copy">
      <span class="eyebrow">Para quien va a abrir o renovar un local</span>
      <h1>¿Qué debería <em>hacer sentir</em> tu local?</h1>
      <p class="lead">No te voy a preguntar qué estilo quieres. Responde siete preguntas sobre lo que quieres provocar y recibe la primera dirección espacial de tu negocio: atmósfera, materiales, luz y paleta.</p>
      <div class="meta"><span>7 preguntas</span><span>·</span><span>3 minutos</span><span>·</span><span>Gratis</span></div>
      <div class="actions"><button class="btn" id="start">Descubrir mi ADN Espacial</button></div>
    </div>
    ${sample}
  </section>`;
  document.getElementById("start").onclick = ()=>go(1);
}

function stepScreen(){
  let body="", title="", hint="", valid=false;
  switch(S.step){
    case 1: title="Tu negocio es…"; hint="Elige el que más se acerque.";
      body=`<div class="opts">${BUSINESS.map(o=>optBtn("business",o,S.business===o.id)).join("")}</div>`; valid=!!S.business; break;
    case 2: title="Cuando alguien entra, ¿qué quieres que sienta primero?"; hint="Solo una. La primera impresión dura unos diez segundos.";
      body=`<div class="opts">${FIRST.map(o=>optBtn("first",o,S.first===o.id)).join("")}</div>`; valid=!!S.first; break;
    case 3: title="¿Qué no debería transmitir nunca?"; hint="Elige hasta dos.";
      body=`<div class="opts">${AVOID.map(o=>optBtn("avoid",o,S.avoid.includes(o.id))).join("")}</div>`; valid=S.avoid.length>0; break;
    case 4: title="¿Cómo quieres que se sienta tu cliente al salir?"; hint="Esto define lo que recordará.";
      body=`<div class="opts">${AFTER.map(o=>optBtn("after",o,S.after===o.id)).join("")}</div>`; valid=!!S.after; break;
    case 5: title="Si tu marca fuera un lugar…"; hint="Elige un lado en cada par, sin pensarlo mucho.";
      body=`<div class="pairs">${PAIRS.map(p=>`<div class="pair"><span class="k">${p.k}</span>${optBtn("pair:"+p.id,p.a,S.pairs[p.id]===p.a.id)}${optBtn("pair:"+p.id,p.b,S.pairs[p.id]===p.b.id)}</div>`).join("")}</div>`;
      valid=Object.values(S.pairs).every(Boolean); break;
    case 6: title="Cuéntame tu negocio en una o dos frases"; hint="Opcional, pero es lo que más afina el resultado. Por ejemplo: “Una cafetería en Barranco donde la gente pueda trabajar y sentir que escapa de la ciudad.”";
      body=`<div class="field"><textarea id="desc" rows="4" maxlength="280" placeholder="Escribe con tus palabras…">${esc(S.desc)}</textarea><div class="counter"><span id="cnt">${S.desc.length}</span>/280</div></div>`; valid=true; break;
    case 7: title="¿A nombre de quién preparo tu ficha?"; hint="Tu resultado aparece en el siguiente paso.";
      body=`<div class="fields">
        <div class="field"><label for="name">Nombre</label><input id="name" type="text" autocomplete="given-name" value="${esc(S.name)}" placeholder="Tu nombre"></div>
      </div>
      <div class="field"><label>¿En qué momento estás?</label><div class="opts">${[{id:"abrir",t:"Voy a abrir"},{id:"renovar",t:"Quiero renovar"},{id:"explorar",t:"Solo estoy explorando"}].map(o=>optBtn("stage",o,S.stage===o.id)).join("")}</div></div>
      <label class="check" for="consent"><input type="checkbox" id="consent" ${S.consent?"checked":""}> <span>He leído la <a href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a> y acepto que, si envío mi ficha, Claudia Arriola use mis datos para responderme y contactarme sobre mi proyecto. Puedo retirar mi consentimiento cuando quiera.</span></label>
      <label class="check" for="marketing"><input type="checkbox" id="marketing" ${S.marketing?"checked":""}> <span>Opcional: acepto recibir novedades y promociones de Claudia Arriola. Si no lo marcas, igual recibes tu resultado.</span></label>
      <p class="note">Tu ficha se genera en tu propio navegador y esta página no guarda tus respuestas. Solo me llegan si eliges enviarlas por WhatsApp en el siguiente paso.</p>`;
      valid = S.name.trim().length>1 && S.stage && S.consent; break;
  }
  app.innerHTML = `${progress()}
  <section class="step fade">
    <span class="eyebrow">Pregunta ${S.step} de ${TOTAL}</span>
    <h2>${title}</h2>
    <p class="hint">${hint}</p>
    ${body}
  </section>
  <div class="nav">
    <button class="btn ghost" id="back">Atrás</button>
    <button class="btn" id="next" ${valid?"":"disabled"}>${S.step===TOTAL?"Ver mi ADN Espacial":"Siguiente"}</button>
  </div>`;
  bindStep();
}

function bindStep(){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const g=b.dataset.g, v=b.dataset.v;
    if(g==="avoid"){
      const i=S.avoid.indexOf(v);
      if(i>=0) S.avoid.splice(i,1); else { if(S.avoid.length>=2) S.avoid.shift(); S.avoid.push(v); }
    } else if(g.startsWith("pair:")) S.pairs[g.slice(5)]=v;
    else S[g]=v;
    const auto = ["business","first","after"].includes(g);
    const cur = S.step;
    stepScreen();
    if(auto) setTimeout(()=>{ if(S.step===cur) go(cur+1); },260);
  });
  const d=document.getElementById("desc");
  if(d) d.oninput=()=>{S.desc=d.value; document.getElementById("cnt").textContent=d.value.length;};
  const mk=document.getElementById("marketing"); if(mk) mk.onchange=()=>{S.marketing=mk.checked;};
  ["name"].forEach(id=>{const i=document.getElementById(id); if(i) i.oninput=()=>{S[id]=i.value; refreshNext();};});
  const c=document.getElementById("consent"); if(c) c.onchange=()=>{S.consent=c.checked; refreshNext();};
  document.getElementById("back").onclick=()=>go(S.step-1);
  document.getElementById("next").onclick=()=>go(S.step+1);
}
function refreshNext(){
  const ok = S.name.trim().length>1 && S.stage && S.consent;
  document.getElementById("next").disabled=!ok;
}

function result(){
  const r = build();
  const first = S.name.trim().split(/\s+/)[0];
  app.innerHTML = `
  <section class="result fade">
    <div style="display:flex;flex-direction:column;gap:18px">
      <span class="eyebrow">${esc(first)}, este es tu punto de partida</span>
      ${fichaHTML(r)}
      <div class="actions"><button class="btn ghost" id="copy">Copiar mi ficha</button><button class="btn ghost" id="again">Empezar de nuevo</button><span class="small" id="copied" aria-live="polite"></span></div>
    </div>
    <aside class="side">
      <div class="cta">
        <span class="eyebrow">Design Flash · 60 min</span>
        <h3>Esto es la intuición. En una sesión lo vemos.</h3>
        <p>Una conversación 1:1 donde convierto esta dirección en una primera imagen de tu local.</p>
        ${WHATSAPP ? `<a class="btn" id="wa" href="${waLink(r)}" target="_blank" rel="noopener">Enviar mi ficha por WhatsApp</a>
        <p class="small" style="color:#6B6252">Se abrirá WhatsApp con tu ficha lista. Tú decides si la envías.</p>` : `<a class="btn" href="${INSTAGRAM}" target="_blank" rel="noopener">Quiero visualizar mi local</a>`}
      </div>
      ${WORKER_URL && S.desc.trim().length>=8 ? `<div class="ai" id="aibox">
        <span class="eyebrow">Lectura de tu descripción</span>
        <p class="small">Una interpretación con IA de lo que escribiste sobre tu negocio.</p>
        <div class="ai-out" id="aiout"></div>
        <div class="actions"><button class="btn ghost" id="aibtn">Leer mi descripción</button></div>
        <p class="small">Para generarla, tu descripción se envía a Anthropic (EE. UU.). Ni esta página ni yo guardamos el texto. <a href="privacidad.html" target="_blank" rel="noopener" style="color:inherit">Más información</a></p>
      </div>` : ""}
    </aside>
  </section>`;
  document.getElementById("again").onclick=()=>{Object.assign(S,{step:0,business:null,first:null,avoid:[],after:null,pairs:{luz:null,ritmo:null,tacto:null},desc:""}); go(0);};
  document.getElementById("copy").onclick=()=>copyFicha(r);
  setupAI(r);
}

function setupAI(r){
  const btn=document.getElementById("aibtn"), out=document.getElementById("aiout");
  if(!btn) return;
  btn.onclick = async ()=>{
    btn.disabled=true; out.className="ai-out thinking"; out.textContent="Leyendo tu descripción…";
    try{
      const res = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
        desc: S.desc.trim(), business: r.biz.t, first: FIRST.find(f=>f.id===S.first).s,
        avoid: S.avoid.map(id=>AVOID.find(x=>x.id===id).t.toLowerCase()).join(" ni "), after: r.after.t.toLowerCase() })});
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.text){ out.className="ai-out"; out.textContent=data.text; btn.hidden=true; return; }
      out.className="ai-out thinking";
      out.textContent = res.status===429 ? "Ya hiciste varias lecturas. Inténtalo en un rato." : "La lectura no está disponible en este momento. Tu ficha sigue completa.";
    }catch(e){
      out.className="ai-out thinking"; out.textContent="No hay conexión para la lectura. Tu ficha sigue completa.";
    }
    btn.disabled=false;
  };
}

function waLink(r){
  const stage = {abrir:"Voy a abrir", renovar:"Quiero renovar", explorar:"Solo estoy explorando"}[S.stage] || "";
  const msg = [`Hola Claudia, soy ${S.name.trim()}. Hice el test ADN Espacial y quiero verlo en una Design Flash.`,
    `Momento: ${stage}.`, S.desc.trim() ? `Mi negocio: ${S.desc.trim()}` : "", "",
    plainFicha(r), "",
    `Acepté la Política de privacidad.${S.marketing ? " También acepto recibir novedades y promociones." : ""}`].filter(x=>x!==null).join("\n");
  return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
}

function plainFicha(r){
  return [`ADN ESPACIAL · versión inicial (${r.code})`, `${r.biz.t} — ${r.a.name}`,
    r.storyLine?`Tu historia: ${r.storyLine}`:"", `Atmósfera: ${r.a.atm}`, `Personalidad: ${r.a.persona}`, `Materiales: ${r.mats.join(" + ")}`,
    `Luz: ${r.k} K, ${r.a.lightTxt}`, `Recorrido: ${r.recorrido}`, `Momento clave: cuidar ${r.biz.moment}`,
    `Al salir: ${r.after.line}`, `Gesto memorable: ${r.a.memo}`,
    `Paleta: ${r.a.pal.map(p=>p[1]+" "+p[0]).join(" · ")}`, r.avoid.length?`Evitar: ${r.avoid.join(". ")}.`:"",
    "", "Claudia Arriola · Diseño lo que aún no existe."].filter(Boolean).join("\n");
}
async function copyFicha(r){
  const out=document.getElementById("copied");
  try{ await navigator.clipboard.writeText(plainFicha(r)); out.textContent="Copiada."; }
  catch(e){ out.textContent="No se pudo copiar desde aquí."; }
}

function go(n){
  S.step=Math.max(0,n);
  if(S.step===0) intro();
  else if(S.step<=TOTAL) stepScreen();
  else result();
  window.scrollTo(0,0);
}
go(0);
})();
</script>

</body>
</html>
